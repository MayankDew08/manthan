[project]
name = "manthan-drive-relay"
version = "0.1.0"
description = "Manthan Drive relay publisher"
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-servicebus>=7.14.3",
    "azure-identity>=1.25.3",
    "python-dotenv>=1.2.2",
    "azure-functions>=1.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
