services:
  neo4j:
    image: neo4j:5.21-community
    container_name: manthan-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in python-ingestion/.env}"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: manthan-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7.2-alpine
    container_name: manthan-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  qdrant_storage:
  redis_data:
